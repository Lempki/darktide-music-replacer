repos:
  - repo: https://github.com/Lempki/dev-standards
    rev: v0.7.0
    hooks:
      - id: sync-files
      - id: check-prose

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-added-large-files
        args: [--maxkb=1024]
